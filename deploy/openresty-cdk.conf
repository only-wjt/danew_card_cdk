# OpenResty / nginx 反代本站（配合 Cloudflare 橙云）
#
# 为什么必须配 real_ip：橙云下 $remote_addr 是 Cloudflare 边缘节点地址。
# 不配的话，应用收到的 X-Real-IP 就是边缘节点，所有访客被识别成少数几个 IP——
# 限流会变成全站共享额度，任何人都能靠连输 5 次管理员密码把真管理员锁 15 分钟。
#
# 放置位置：/usr/local/openresty/nginx/conf/conf.d/cdk.conf
# 宝塔 / 1Panel：站点 → 配置文件，把 set_real_ip_from / real_ip_header 放到 server 块内。
#
# IP 段来源 https://www.cloudflare.com/ips/ ，Cloudflare 增删网段时要同步更新。

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# 直连方不是上面这些网段时，CF-Connecting-IP 一律忽略，避免伪造
real_ip_header CF-Connecting-IP;

server {
    listen 443 ssl;
    http2 on;
    server_name cdk.danew.cc;

    # 证书由现有配置管理（Certbot / 宝塔 / CF 源站证书）；证书不在这里重复配置

    # 与后端上限对齐：公开接口 1MB，管理端/代理端 32MB
    client_max_body_size 32m;

    # 敏感文件不要落到静态目录
    location ~ ^/(\.env|app\.env|\.git|data)/ {
        return 404;
    }

    location / {
        # 应用容器映射到宿主 127.0.0.1:9080（只监听本机，不经公网暴露）
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # 关键：$remote_addr 已被 real_ip 解析为访客真实 IP。
        # 应用优先读 X-Real-IP（X-Forwarded-For 末尾是 CF 边缘 IP，取右会取错）。
        proxy_set_header X-Real-IP $remote_addr;
        # 固定写成 $remote_addr，不用 $proxy_add_x_forwarded_for：
        # 后者会把 CF 传来的 XFF 一起带上，应用侧解析容易取到边缘 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhook 与批量充值回调可能较慢
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# 若用了 Cloudflare 源站证书，443 证书路径换成 CF Origin Certificate；
# 若源站只允许 CF 回源，可用 allow <CF 段> + deny all，但那样就无法直连排查。
